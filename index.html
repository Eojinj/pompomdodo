<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼폼도도 - 뽀모도로 스터디룸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 시작 화면 -->
    <div id="startScreen">
        <h1>🐰 폼폼도도</h1>
        
        <div class="start-options">
            <div class="option-group">
                <h3>닉네임</h3>
                <input 
                    type="text" 
                    id="nicknameInput" 
                    class="nickname-input" 
                    placeholder="닉네임을 입력하세요" 
                    maxlength="12"
                    value=""
                >
            </div>

            <div class="option-group">
                <h3>서버 선택</h3>
                <div class="option-buttons">
                    <div class="option-btn selected" data-server="1">
                        서버 1<br>
                        <small>한국</small>
                    </div>
                    <div class="option-btn" data-server="2">
                        서버 2<br>
                        <small>아시아</small>
                    </div>
                    <div class="option-btn" data-server="3">
                        서버 3<br>
                        <small>글로벌</small>
                    </div>
                </div>
            </div>

            <div class="option-group">
                <h3>뽀모도로 유형</h3>
                <div class="option-buttons">
                    <div class="option-btn selected" data-pomodoro="25">
                        기본형<br>
                        <small>25분 작업 / 5분 휴식</small>
                    </div>
                    <div class="option-btn" data-pomodoro="50">
                        집중형<br>
                        <small>50분 작업 / 10분 휴식</small>
                    </div>
                </div>
            </div>

            <button class="start-button" onclick="startGame()">
                시작하기
            </button>
        </div>
    </div>

    <!-- 메인 게임 화면 -->
    <div id="gameScreen">
        <div class="top-bar">
            <div class="timer-section">
                <div class="timer-label">
                    <span class="status-indicator status-working" id="statusIndicator"></span>
                    <span id="statusText">작업 시간</span>
                </div>
                <div class="timer-display" id="timerDisplay">25:00</div>
            </div>
            
            <div class="info-section">
                <div id="currentTime">현재 시간: --:--:--</div>
                <div id="nextBreak">다음 휴식: --:--</div>
                <div>접속자: <span id="onlineCount">1</span>명</div>
            </div>
        </div>

        <div class="main-content">
            <div class="field-container" id="fieldContainer">
                <canvas id="field"></canvas>
            </div>
        </div>

        <div class="character-controls">
            <button class="settings-toggle" onclick="toggleSettings()">⚙️ 설정</button>
        </div>

        <!-- 설정 패널 (서랍식) -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <span>설정</span>
                <button class="close-settings" onclick="toggleSettings()">×</button>
            </div>
            
            <div class="settings-content">
                <div class="setting-group">
                    <label>닉네임</label>
                    <input 
                        type="text" 
                        id="nicknameChange" 
                        class="setting-input" 
                        placeholder="닉네임을 입력하세요"
                        maxlength="12"
                    >
                    <button class="setting-btn" onclick="changeNickname()">변경</button>
                </div>

                <div class="setting-group">
                    <label>캐릭터 선택</label>
                    <select id="characterSelect" class="setting-select">
                        <option value="rabbit">토끼 🐰</option>
                        <option value="cat">고양이 🐱</option>
                        <option value="dog">강아지 🐶</option>
                        <option value="bear">곰 🐻</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>색상 선택</label>
                    <div class="color-picker">
                        <div class="color-option selected" style="background: #FFB6C1;" data-color="#FFB6C1"></div>
                        <div class="color-option" style="background: #87CEEB;" data-color="#87CEEB"></div>
                        <div class="color-option" style="background: #98FB98;" data-color="#98FB98"></div>
                        <div class="color-option" style="background: #FFD700;" data-color="#FFD700"></div>
                        <div class="color-option" style="background: #DDA0DD;" data-color="#DDA0DD"></div>
                    </div>
                </div>

                <div class="setting-group">
                    <label>현재 닉네임: <span id="currentNickname"></span></label>
                </div>
            </div>
        </div>

        <!-- 채팅 토글 버튼 -->
        <button class="chat-toggle" id="chatToggle" onclick="toggleChat()">💬</button>

        <!-- 채팅 패널 -->
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <span>채팅</span>
                <button class="close-chat" onclick="toggleChat()">×</button>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="system-message">채팅방에 입장했습니다</div>
            </div>
            
            <div class="chat-input-area">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="메시지를 입력하세요..."
                    onkeypress="handleChatKeypress(event)"
                >
                <button class="chat-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
