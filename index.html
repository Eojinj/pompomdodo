<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼폼도도 - 뽀모도로 스터디룸</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
</head>
<body>
    <!-- 시작 화면 -->
    <div id="startScreen">
        <h1>🐠 <span data-i18n="title">폼폼도도</span></h1>
        
        <div class="start-options">
            <div class="option-group">
                <h3 data-i18n="nickname">닉네임</h3>
                <input 
                    type="text" 
                    id="nicknameInput" 
                    class="nickname-input" 
                    data-i18n-placeholder="nicknamePlaceholder"
                    placeholder="닉네임을 입력하세요" 
                    maxlength="12"
                    value=""
                >
            </div>

            <div class="option-group">
                <h3 data-i18n="goal">오늘의 목표</h3>
                <input 
                    type="text" 
                    id="sessionGoalInput" 
                    class="nickname-input" 
                    data-i18n-placeholder="goalPlaceholder"
                    placeholder="예: 수학 과제 3페이지 완료하기" 
                    maxlength="50"
                    value=""
                >
            </div>

            <div class="option-group">
                <h3 data-i18n="language">언어 설정</h3>
                <div class="option-buttons">
                    <div class="option-btn selected" data-language="ko">
                        한국어<br>
                        <small>Korean (KST)</small>
                    </div>
                    <div class="option-btn" data-language="en">
                        English<br>
                        <small>영어 (EST)</small>
                    </div>
                </div>
            </div>

            <div class="option-group">
                <h3 data-i18n="pomodoroType">뽀모도로 유형</h3>
                <div class="option-buttons">
                    <div class="option-btn selected" data-pomodoro="25">
                        <span data-i18n="basic">기본형</span><br>
                        <small data-i18n="basic-desc">25분 작업 / 5분 휴식</small>
                    </div>
                    <div class="option-btn" data-pomodoro="50">
                        <span data-i18n="focus">집중형</span><br>
                        <small data-i18n="focus-desc">50분 작업 / 10분 휴식</small>
                    </div>
                </div>
            </div>

            <button class="start-button" onclick="startGame()">
                <span data-i18n="start">시작하기</span>
            </button>
        </div>
    </div>

    <!-- 메인 게임 화면 -->
    <div id="gameScreen">
        <div class="top-bar">
            <div class="timer-section">
                <button class="home-button" onclick="goToHome()" title="메인 화면으로">
                    <span data-i18n="home">홈</span>
                </button>
                <div class="timer-info">
                    <div class="timer-label">
                        <span class="status-indicator status-working" id="statusIndicator"></span>
                        <span id="statusText" data-i18n="working">작업 중</span>
                    </div>
                    <div class="timer-display" id="timerDisplay">25:00</div>
                </div>
            </div>
            
            <div class="info-section">
                <div id="nextBreak">--:--</div>
                <div><span id="onlineCount">1</span><span data-i18n="people">명</span></div>
                <button class="fish-collection-btn" onclick="toggleFishCollection()" title="물고기 도감">🐠</button>
                <button class="settings-toggle-top" onclick="toggleSettings()">⚙️</button>
            </div>
        </div>

        <div class="main-content">
            <div class="field-container" id="fieldContainer">
                <canvas id="field"></canvas>
                
                <!-- 채팅 영역 -->
                <div class="chat-area">
                    <div class="chat-messages-inline" id="chatMessages">
                        <div class="system-message" data-i18n="chatWelcome">채팅방에 입장했습니다</div>
                    </div>
                    
                    <div class="chat-input-inline">
                        <button class="memo-btn-inline" onclick="toggleMemo()" title="메모">📝</button>
                        <input 
                            type="text" 
                            class="chat-input" 
                            id="chatInput" 
                            data-i18n-placeholder="chatPlaceholder"
                            placeholder="메시지를 입력하세요..."
                            onkeypress="handleChatKeypress(event)"
                        >
                    </div>
                </div>
            </div>
        </div>

        <!-- 설정 패널 -->
        <div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <span data-i18n="settings">설정</span>
                <button class="close-settings" onclick="toggleSettings()">×</button>
            </div>
            
            <div class="settings-content">
                <div class="setting-group">
                    <label data-i18n="nickname">닉네임</label>
                    <input 
                        type="text" 
                        id="nicknameChange" 
                        class="setting-input" 
                        data-i18n-placeholder="nicknamePlaceholder"
                        placeholder="닉네임을 입력하세요"
                        maxlength="12"
                    >
                    <button class="setting-btn" onclick="changeNickname()">
                        <span data-i18n="change">변경</span>
                    </button>
                </div>

                <div class="setting-group">
                    <label data-i18n="goal">오늘의 목표</label>
                    <input 
                        type="text" 
                        id="goalChange" 
                        class="setting-input" 
                        data-i18n-placeholder="goalPlaceholder"
                        placeholder="오늘의 목표를 입력하세요"
                        maxlength="50"
                    >
                    <button class="setting-btn" onclick="changeGoal()">
                        <span data-i18n="change">변경</span>
                    </button>
                </div>

                <div class="setting-group">
                    <label data-i18n="themeSettings">테마 설정</label>
                    <div class="theme-toggle-container">
                        <button class="theme-toggle-btn" onclick="toggleTheme()">
                            <span id="themeIcon">☀️</span>
                            <span id="themeText" data-i18n="lightMode">라이트 모드</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TODO 패널 -->
        <div class="memo-panel-overlay" id="memoPanelOverlay" onclick="toggleMemo()"></div>
        <div class="memo-panel" id="memoPanel">
            <div class="memo-header">
                <span data-i18n="todoTitle">📝 쉬는 시간 TODO</span>
                <button class="close-memo" onclick="toggleMemo()">×</button>
            </div>
            <div class="memo-content">
                <div class="todo-list-container">
                    <div class="todo-list" id="todoList">
                        <!-- TODO 항목들이 여기에 추가됩니다 -->
                    </div>
                </div>
                <div class="memo-info" data-i18n="todoInfo">💡 쉬는 시간이 되면 자동으로 표시됩니다</div>
                <div class="todo-input-container">
                    <input 
                        type="text" 
                        id="todoInput" 
                        class="todo-input" 
                        data-i18n-placeholder="todoPlaceholder"
                        placeholder="할 일을 입력하고 엔터를 누르세요..."
                        onkeypress="handleTodoKeypress(event)"
                    >
                </div>
            </div>
        </div>

        <!-- TODO 알림 -->
        <div class="memo-notification" id="memoNotification">
            <div class="memo-notification-content" id="memoNotificationContent">
                <!-- TODO 항목들이 여기에 표시됩니다 -->
            </div>
            <button class="close-memo-notification" onclick="closeMemoNotification()">×</button>
        </div>

        <!-- 알람 모달 -->
        <div class="alarm-notification" id="alarmNotification">
            <div class="alarm-icon">⏰</div>
            <div class="alarm-title" id="alarmTitle" data-i18n="alarm">알람</div>
            <div class="alarm-message" id="alarmMessage" data-i18n="alarmMessage">메시지</div>
            <button class="alarm-confirm-btn" onclick="closeAlarmNotification()">
                <span data-i18n="confirm">확인</span>
            </button>
        </div>

        <!-- 물고기 도감 모달 -->
        <div class="fish-collection-overlay" id="fishCollectionOverlay" onclick="toggleFishCollection()"></div>
        <div class="fish-collection-panel" id="fishCollectionPanel">
            <div class="fish-collection-header">
                <span data-i18n="fishCollection">🐠 물고기 도감</span>
                <button class="close-fish-collection" onclick="toggleFishCollection()">×</button>
            </div>
            
            <div class="fish-collection-content">
                <div class="fish-unlock-section">
                    <button class="fish-unlock-btn" onclick="unlockRandomFish()">
                        <span data-i18n="unlockFish">🎁 랜덤 물고기 3마리 받기</span>
                    </button>
                    <div class="fish-unlock-info">
                        <span data-i18n="fishUnlockInfo">💡 후원 기능은 곧 추가됩니다</span>
                    </div>
                </div>
                
                <div class="fish-grid" id="fishGrid">
                    <!-- 물고기 아이템들이 여기에 추가됩니다 -->
                </div>
            </div>
        </div>
    </div>
    <!-- Firebase SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script>

    <!-- window.firebaseConfig 정의 -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
